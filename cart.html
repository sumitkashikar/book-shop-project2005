<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
</head>
<body>

    <div class="main-cart-name">

        <div class="main-cart-name-1">
            <h2>My Cart  </h2>
            <span>0</span>
        </div>

        <a href="index.html">
            <i class="fa-solid fa-x"></i>
        </a>
    </div>

    <div class="main-cart-con">
        <h2>Your Cart is Empty!</h2>
        <p class="main-cart-text">Start exploring books & more you'll love</p>

        <div class="main-cart-icon">
            <!-- mci = main-cart-icon -->

            <div class="mci">

                <div class="mci-ico">
                    <img src="assets/icons/security.png">
                </div>

                <div class="mci-titl">
                    <p>Piracy Free</p>
                </div>

            </div>

            <div class="mci">

                <div class="mci-ico">
                    <img src="assets/icons/padlock.png">
                </div>

                <div class="mci-titl">
                    <p>Secure Payments</p>
                </div>

            </div>

            <div class="mci">

                <div class="mci-ico">
                    <img src="assets/icons/express-delivery.png">
                </div>

                <div class="mci-titl">
                    <p>Express Delivery</p>
                </div>

            </div>

        </div>

        <a href="index.html">
            <button class="main-cart-butt">
                Shop Now
            </button>
        </a>

    </div>
    
</body>
</html>
